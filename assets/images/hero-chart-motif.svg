<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141b5e"/>
      <stop offset="55%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#232c8f"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BDB76B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#BDB76B" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- faint dot grid -->
  <g fill="#ffffff" opacity="0.06">
    <path d="M0 0h1440v900H0z" fill="none"/>
    <g id="dots"></g>
  </g>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="60" cy="60" r="1.4"/><circle cx="140" cy="60" r="1.4"/><circle cx="220" cy="60" r="1.4"/><circle cx="300" cy="60" r="1.4"/><circle cx="380" cy="60" r="1.4"/><circle cx="460" cy="60" r="1.4"/><circle cx="540" cy="60" r="1.4"/><circle cx="620" cy="60" r="1.4"/><circle cx="700" cy="60" r="1.4"/><circle cx="780" cy="60" r="1.4"/><circle cx="860" cy="60" r="1.4"/><circle cx="940" cy="60" r="1.4"/><circle cx="1020" cy="60" r="1.4"/><circle cx="1100" cy="60" r="1.4"/><circle cx="1180" cy="60" r="1.4"/><circle cx="1260" cy="60" r="1.4"/><circle cx="1340" cy="60" r="1.4"/>
    <circle cx="60" cy="140" r="1.4"/><circle cx="140" cy="140" r="1.4"/><circle cx="220" cy="140" r="1.4"/><circle cx="300" cy="140" r="1.4"/><circle cx="380" cy="140" r="1.4"/><circle cx="460" cy="140" r="1.4"/><circle cx="540" cy="140" r="1.4"/><circle cx="620" cy="140" r="1.4"/><circle cx="700" cy="140" r="1.4"/><circle cx="780" cy="140" r="1.4"/><circle cx="860" cy="140" r="1.4"/><circle cx="940" cy="140" r="1.4"/><circle cx="1020" cy="140" r="1.4"/><circle cx="1100" cy="140" r="1.4"/><circle cx="1180" cy="140" r="1.4"/><circle cx="1260" cy="140" r="1.4"/><circle cx="1340" cy="140" r="1.4"/>
    <circle cx="60" cy="220" r="1.4"/><circle cx="140" cy="220" r="1.4"/><circle cx="220" cy="220" r="1.4"/><circle cx="300" cy="220" r="1.4"/><circle cx="380" cy="220" r="1.4"/><circle cx="460" cy="220" r="1.4"/><circle cx="540" cy="220" r="1.4"/><circle cx="620" cy="220" r="1.4"/><circle cx="700" cy="220" r="1.4"/><circle cx="780" cy="220" r="1.4"/><circle cx="860" cy="220" r="1.4"/><circle cx="940" cy="220" r="1.4"/><circle cx="1020" cy="220" r="1.4"/><circle cx="1100" cy="220" r="1.4"/><circle cx="1180" cy="220" r="1.4"/><circle cx="1260" cy="220" r="1.4"/><circle cx="1340" cy="220" r="1.4"/>
  </g>

  <!-- horizon grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="620" x2="1440" y2="620"/>
    <line x1="0" y1="700" x2="1440" y2="700"/>
    <line x1="0" y1="780" x2="1440" y2="780"/>
    <line x1="0" y1="860" x2="1440" y2="860"/>
  </g>

  <!-- candlestick cluster, ascending trend, lower-right -->
  <g stroke-linecap="round">
