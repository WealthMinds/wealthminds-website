    <g stroke="#BDB76B" stroke-opacity="0.55" stroke-width="2">
      <line x1="760" y1="760" x2="760" y2="640"/>
      <line x1="810" y1="740" x2="810" y2="600"/>
      <line x1="860" y1="700" x2="860" y2="560"/>
      <line x1="910" y1="720" x2="910" y2="540"/>
      <line x1="960" y1="660" x2="960" y2="500"/>
      <line x1="1010" y1="630" x2="1010" y2="460"/>
      <line x1="1060" y1="600" x2="1060" y2="420"/>
      <line x1="1110" y1="560" x2="1110" y2="380"/>
      <line x1="1160" y1="540" x2="1160" y2="340"/>
      <line x1="1210" y1="500" x2="1210" y2="310"/>
      <line x1="1260" y1="470" x2="1260" y2="280"/>
      <line x1="1310" y1="440" x2="1310" y2="250"/>
    </g>
    <!-- bodies -->
    <g>
      <rect x="748" y="700" width="24" height="45" rx="2" fill="#e2604f" opacity="0.85"/>
      <rect x="798" y="660" width="24" height="55" rx="2" fill="#BDB76B" opacity="0.9"/>
      <rect x="848" y="610" width="24" height="60" rx="2" fill="#e2604f" opacity="0.85"/>
      <rect x="898" y="590" width="24" height="60" rx="2" fill="#BDB76B" opacity="0.9"/>
      <rect x="948" y="545" width="24" height="65" rx="2" fill="#BDB76B" opacity="0.9"/>
      <rect x="998" y="500" width="24" height="65" rx="2" fill="#e2604f" opacity="0.85"/>
      <rect x="1048" y="465" width="24" height="65" rx="2" fill="#BDB76B" opacity="0.9"/>
      <rect x="1098" y="430" width="24" height="65" rx="2" fill="#BDB76B" opacity="0.9"/>
      <rect x="1148" y="395" width="24" height="70" rx="2" fill="#e2604f" opacity="0.85"/>
      <rect x="1198" y="360" width="24" height="70" rx="2" fill="#BDB76B" opacity="0.9"/>
      <rect x="1248" y="330" width="24" height="70" rx="2" fill="#BDB76B" opacity="0.9"/>
      <rect x="1298" y="300" width="24" height="70" rx="2" fill="#BDB76B" opacity="0.9"/>
    </g>
  </g>

  <!-- smooth rising trend line, upper area -->
  <path d="M -20 560 C 200 520, 340 480, 480 430 S 760 300, 900 250 S 1180 150, 1460 90"
        fill="none" stroke="url(#lineGlow)" stroke-width="4" opacity="0.9"/>
  <path d="M -20 560 C 200 520, 340 480, 480 430 S 760 300, 900 250 S 1180 150, 1460 90"
        fill="none" stroke="#BDB76B" stroke-width="1.5" opacity="0.6"/>

  <!-- marker dots along the trend line -->
  <g fill="#BDB76B">
    <circle cx="480" cy="430" r="4" opacity="0.9"/>
    <circle cx="900" cy="250" r="4" opacity="0.9"/>
    <circle cx="1180" cy="150" r="4" opacity="0.9"/>
  </g>
</svg>
